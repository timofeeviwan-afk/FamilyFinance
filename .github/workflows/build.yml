name: Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore FamilyFinance.sln

      - name: Build
        run: dotnet build FamilyFinance.sln -c Release --no-restore

      - name: Publish App
        run: dotnet publish src/FamilyFinance.App/FamilyFinance.App.csproj -c Release -o publish

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: FamilyFinance-App
          path: publish/
